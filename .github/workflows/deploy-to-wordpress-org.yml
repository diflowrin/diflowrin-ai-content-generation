name: Deploy to WordPress.org

# Pushing a v* tag publishes that version to the WordPress.org directory:
# trunk is updated, tags/<version> is created, and the listing assets in
# .wordpress-org/ are synced. Only the "Stable tag" in readme.txt decides what
# users actually receive as an update.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SVN_USERNAME  your WordPress.org username (diflowrin)
#   SVN_PASSWORD  the SVN password from your WordPress.org profile,
#                 which is NOT your wordpress.org login password
#
# See RELEASING.md for the full procedure.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy, without the v (e.g. 1.3.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run: check and build, but commit nothing to SVN"
        type: boolean
        default: true

jobs:
  deploy:
    name: Publish ${{ inputs.version || github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v7

      - name: Work out the version being released
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Check the version agrees in all three places
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -u
          main_file="diflowrin-ai-content-generation.php"

          # || true so a missing line reports as a mismatch below rather than
          # aborting the step with bash -e and no explanation.
          header=$(grep -m1 '^ \* Version:' "$main_file" | sed -E 's/^ \* Version: *//' | tr -d '[:space:]' || true)
          constant=$(grep -m1 "define( 'DIFLOWRIN_CG_VERSION'" "$main_file" | grep -o "'[0-9][^']*'" | tail -1 | tr -d "'" || true)
          stable=$(grep -m1 '^Stable tag:' readme.txt | sed -E 's/^Stable tag: *//' | tr -d '[:space:]' || true)

          echo "tag:              $VERSION"
          echo "plugin header:    $header"
          echo "DIFLOWRIN_CG_VERSION: $constant"
          echo "readme Stable tag: $stable"

          failed=0
          for pair in "plugin header:$header" "DIFLOWRIN_CG_VERSION:$constant" "readme.txt Stable tag:$stable"; do
            label="${pair%:*}"
            value="${pair##*:}"
            if [ "$value" != "$VERSION" ]; then
              echo "::error::$label says '$value' but the release is '$VERSION'. Bump it and re-tag."
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

          if ! grep -q "^= $VERSION =" readme.txt; then
            echo "::warning::readme.txt has no '= $VERSION =' changelog entry. Users see this text on the update screen."
          fi

      - name: Lint every PHP file
        run: |
          if ! command -v php >/dev/null 2>&1; then
            echo "::warning::No PHP on the runner, skipping the syntax check."
            exit 0
          fi
          php -v | head -1
          # A parse error here would fatal every site that auto-updates, so this
          # gate matters more than it looks.
          find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Deploy to the WordPress.org SVN repository
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
          dry-run: ${{ inputs.dry_run || false }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          SLUG: diflowrin-ai-content-generation

      - name: Keep the built zip with the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: diflowrin-ai-content-generation-${{ steps.version.outputs.version }}
          path: diflowrin-ai-content-generation.zip
          if-no-files-found: warn
